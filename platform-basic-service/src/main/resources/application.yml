server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /

spring:
  application:
    name: platform-basic-service
  datasource:
    url: ${BASIC_DB_URL:jdbc:mysql://127.0.0.1:3306/energy_platform_basic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${BASIC_DB_USERNAME:energy_basic_user}
    password: ${BASIC_DB_PASSWORD:energy_basic_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    token-secret: ${BASIC_AUTH_TOKEN_SECRET:energy-basic-dev-secret}
  log-service:
    base-url: ${LOG_SERVICE_URL:http://127.0.0.1:8091}
    connect-timeout-ms: ${LOG_SERVICE_CONNECT_TIMEOUT_MS:1500}
    read-timeout-ms: ${LOG_SERVICE_READ_TIMEOUT_MS:2500}
